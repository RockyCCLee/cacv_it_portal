<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CACV IT Portal</title>
  <meta name="description" content="CACV Church IT Portal - quick access to IT resources." />
  <link rel="icon" type="image/png" href="assets/cma-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="header">
    <div class="logo-badge">
      <img src="assets/cma-logo.png" alt="The Christian and Missionary Alliance logo" />
    </div>
    <div class="title-block">
      <h1 class="title">CACV <span>IT Portal</span></h1>
      <p class="subtitle"><span class="pulse" aria-hidden="true"></span>Church IT Resources &amp; Documentation</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <span class="toolbar-label">// RESOURCES</span>
      <div class="toolbar-actions">
        <button type="button" class="btn-ghost" id="expandAll">Expand all</button>
        <button type="button" class="btn-ghost" id="collapseAll">Collapse all</button>
      </div>
    </div>

    <nav id="portal-tree" class="tree" aria-label="IT resources"></nav>
  </main>

  <footer class="footer">
    <p>🔒 Document access is managed via Google Drive permissions.</p>
    <p class="copy">&copy; <span id="year"></span> CACV IT Ministry</p>
  </footer>

  <script src="js/links.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
